<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PYRA Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03050b; --panel:rgba(10,16,30,.72); --panel-solid:#0a101e; --line:rgba(140,180,255,.14);
  --text:#e6edf9; --dim:#8a9bb8; --faint:#5a6b88;
  --blue:#5fb7ff; --cyan:#46f0e0; --amber:#ffb347; --fire:#ff6a2b; --red:#ff4d5e; --green:#3ee08f; --violet:#a98bff;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#pins{position:fixed;inset:0;pointer-events:none;z-index:2}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;
  font:600 11px var(--mono);letter-spacing:.04em;padding:5px 8px;border-radius:6px;background:rgba(6,10,20,.78);
  border:1px solid var(--line);backdrop-filter:blur(6px);transition:opacity .3s,border-color .3s}
.pin::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:linear-gradient(var(--line),transparent)}
.pin .v{color:var(--cyan);margin-left:6px}
.pin.watch{border-color:rgba(255,179,71,.7)} .pin.watch .v{color:var(--amber)}
.pin.alert{border-color:rgba(255,77,94,.9);box-shadow:0 0 18px rgba(255,77,94,.4)} .pin.alert .v{color:var(--red)}
.pin.node{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:0}
.pin.node small{display:none;font:400 10px var(--mono);color:var(--dim)}
.pin.node.sel{border-color:rgba(255,106,43,.8)} .pin.node.sel small{display:block}
.pin.axis{background:none;border:none;color:var(--dim);font-weight:400}
.pin.axis::after{display:none}
.pin.hidden{opacity:0;pointer-events:none}

/* top bar */
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:18px;padding:14px 20px;
  background:linear-gradient(rgba(3,5,11,.9),rgba(3,5,11,0))}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 60%,#fff 0,#9fd8ff 18%,#2f7bff 45%,rgba(47,123,255,0) 70%);box-shadow:0 0 22px #2f7bff}
.brand b{font-size:18px;letter-spacing:.18em}
.brand span{display:block;font:400 10px var(--mono);color:var(--dim);letter-spacing:.08em}
nav{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:4px;margin-left:auto}
nav button,.btn{font:500 13px var(--sans);color:var(--dim);background:none;border:0;padding:8px 14px;border-radius:7px;cursor:pointer;transition:.2s}
nav button:hover,.btn:hover{color:var(--text)}
nav button.on{background:rgba(95,183,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(95,183,255,.4)}
nav button i{font-style:normal;font:400 10px var(--mono);color:var(--faint);margin-right:6px}
.btn.tour{border:1px solid var(--line);background:rgba(255,255,255,.04)}
.btn.tour.on{color:#fff;border-color:var(--fire);box-shadow:0 0 20px rgba(255,106,43,.35)}

/* panels */
.panel{position:fixed;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);
  padding:16px;width:300px;max-height:calc(100vh - 170px);overflow:auto;scrollbar-width:thin}
#left{left:20px;top:78px}
#right{right:20px;top:78px;width:320px}
.panel h3{font:600 11px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.panel h3 em{font-style:normal;color:var(--amber);font-size:9px;border:1px solid rgba(255,179,71,.4);padding:2px 6px;border-radius:4px}
.panel section+section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--sans);color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:6px 10px;border-radius:20px;cursor:pointer;transition:.2s}
.chip:hover{border-color:rgba(95,183,255,.5)}
.chip.on{background:rgba(95,183,255,.18);border-color:var(--blue)}
.slider{margin-top:14px}
.slider label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
.slider label b{font:600 12px var(--mono);color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--blue) var(--p,50%),rgba(255,255,255,.12) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(95,183,255,.25),0 0 12px var(--blue);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(95,183,255,.25)}
select{width:100%;font:500 13px var(--sans);color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:8px}
select option{background:var(--panel-solid)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:12px}
.kv span{color:var(--dim)} .kv b{font:600 12px var(--mono);text-align:right}
.big{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.big b{font:700 28px var(--sans)} .big span{font-size:12px;color:var(--dim)}
.state{display:inline-flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.06em;padding:6px 10px;border-radius:6px;margin-bottom:12px}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.state.burn{color:var(--fire);background:rgba(255,106,43,.12)} .state.out{color:var(--faint);background:rgba(255,255,255,.05)}
.state.ok{color:var(--green);background:rgba(62,224,143,.1)} .state.watch{color:var(--amber);background:rgba(255,179,71,.1)} .state.alert{color:var(--red);background:rgba(255,77,94,.12)}
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 12px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--fire));transition:width .3s}
.tele{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:9px;padding:9px 10px;transition:.3s}
.tile span{display:block;font-size:10px;color:var(--dim);letter-spacing:.04em}
.tile b{font:600 15px var(--mono)} .tile small{font:400 10px var(--mono);color:var(--faint)}
.tile.watch{border-color:rgba(255,179,71,.6)} .tile.watch b{color:var(--amber)}
.tile.alert{border-color:rgba(255,77,94,.8);background:rgba(255,77,94,.08)} .tile.alert b{color:var(--red)}
.gaprow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;font-size:12px;margin-bottom:8px}
.gaprow span{color:var(--dim)}
.gap{font:600 10px var(--mono);letter-spacing:.04em;padding:4px 7px;border-radius:5px;justify-self:start}
.gap small{font-weight:400;opacity:.75;margin-left:4px}
.g-DIRECTLY_TESTED{background:rgba(62,224,143,.15);color:var(--green)}
.g-INSUFFICIENT{background:rgba(70,240,224,.12);color:var(--cyan)}
.g-BOUNDED{background:rgba(95,183,255,.15);color:var(--blue)}
.g-ONE_SIDED{background:rgba(255,179,71,.14);color:var(--amber)}
.g-NOT_COMPARABLE{background:rgba(169,139,255,.15);color:var(--violet)}
.g-NO_INDEXED_DATA{background:rgba(255,77,94,.14);color:var(--red)}
.combo{margin-top:12px;padding:12px;border-radius:10px;border:1px dashed var(--line);font-size:12px;line-height:1.5;color:var(--dim)}
.combo b{color:var(--text)}
.near{font:400 11px var(--mono);color:var(--dim);line-height:1.8}
.near b{color:var(--text);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{font-size:11px;line-height:1.5;color:var(--faint);margin-top:12px}
p.lead{font-size:13px;line-height:1.55;color:var(--dim)}
p.lead b{color:var(--text)}
.events{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.events .chip{border-radius:8px;text-align:left;font-size:11px}

/* caption */
#caption{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:4;max-width:min(680px,calc(100vw - 40px));text-align:center;pointer-events:none}
#caption .t{font:600 11px var(--mono);letter-spacing:.2em;color:var(--fire);text-transform:uppercase}
#caption .s{font-size:17px;line-height:1.45;margin-top:6px;text-shadow:0 2px 20px #000;transition:opacity .5s}
#progress{height:2px;background:rgba(255,255,255,.1);margin:12px auto 0;width:160px;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .3s}
#progress i{display:block;height:100%;width:0;background:var(--fire)}
#disclaimer{position:fixed;left:20px;bottom:16px;z-index:4;font:400 10px var(--mono);color:var(--faint);letter-spacing:.05em;max-width:300px;line-height:1.5}

#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);transition:opacity 1s}
#loading div{font:500 12px var(--mono);letter-spacing:.3em;color:var(--dim);text-align:center}
#loading div::before{content:"";display:block;width:60px;height:60px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle,#fff 0,#7ac4ff 15%,#2f7bff 40%,transparent 70%);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.7);opacity:.6}}
#err{display:none;position:fixed;inset:0;z-index:21;place-items:center;background:var(--bg);color:var(--dim);font-size:14px;text-align:center;padding:20px}

@media (max-width:820px){
  header{padding:10px 16px;flex-wrap:wrap;gap:8px}
  nav{margin-left:0;order:3;width:100%;justify-content:space-between}
  nav button{padding:7px 8px;font-size:12px} nav button i{display:none}
  .panel{position:fixed;left:16px;right:16px;width:auto;top:auto;max-height:34vh}
  #left{bottom:16px} #right{display:none}
  body.showright #right{display:block;bottom:16px} body.showright #left{display:none}
  #caption{top:118px;min-width:0} #caption .s{font-size:14px}
  #disclaimer{display:none}
  #swap{display:inline-block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="loading"><div>INITIALISING PYRA</div></div>
<div id="err"></div>
<div id="stage"></div>
<div id="pins"></div>

<header>
  <div class="brand"><div class="mark"></div><div><b>PYRA</b><span>PREDICTIVE HAZARD &amp; RELIABILITY ATLAS</span></div></div>
  <nav id="acts">
    <button data-act="habitat" class="on"><i>01</i>Habitat</button>
    <button data-act="atlas"><i>02</i>Evidence Atlas</button>
    <button data-act="pipeline"><i>03</i>Data Pipeline</button>
  </nav>
  <button class="btn tour" id="tour">▶ Tour</button>
  <button class="btn tour" id="swap" style="display:none">⇄</button>
</header>

<aside class="panel" id="left">
  <section>
    <h3>Scenario</h3>
    <div class="chips" id="presets"></div>
  </section>
  <section>
    <h3>Atmosphere &amp; environment</h3>
    <div class="slider"><label>Oxygen <b id="o2v"></b></label><input type="range" id="o2" min="10" max="40" step="0.5"></div>
    <div class="slider"><label>Total pressure <b id="pv"></b></label><input type="range" id="p" min="20" max="110" step="1"></div>
    <div class="slider"><label>Gravity <b id="gv"></b></label><input type="range" id="g" min="0" max="1" step="0.005"></div>
    <div class="slider"><label>Ventilation flow <b id="fv"></b></label><input type="range" id="f" min="0" max="40" step="0.5"></div>
    <div class="slider"><label>Material</label>
      <select id="mat"><option value="fabric">Fabric (cotton / Nomex)</option><option value="plastic">Plastic (PMMA)</option><option value="paper">Paper (Kimwipe)</option><option value="wire">Wire insulation</option></select>
    </div>
    <p class="note">Flame shape, telemetry and evidence points are SIMULATED or SYNTHETIC for this demo. PYRA shows where evidence exists. It does not predict fires.</p>
  </section>
</aside>

<aside class="panel" id="right"></aside>

<div id="caption"><div class="t" id="capT"></div><div class="s" id="capS"></div><div id="progress"><i></i></div></div>

<script src="flame-model.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   CONFIG (mirrors config/decisions.json and config/alerts.json)
   ============================================================ */
const TOL = { o2: 2, p: 7, f: 5, g: 0.05 };           // gap_tolerances
const MIN_RUNS = 3;                                      // min_runs_for_sufficient
const LIMITS = { o2:{max:35}, co:{max:25}, smoke:{max:0.2}, temp:{max:30}, flow:{min:5} }; // PLACEHOLDER
const PRESETS = [
  { id:'iss',   name:'ISS cabin',          o2:21,  p:101, g:0.0,   f:10, cap:'Station air: Earth-like oxygen and pressure, but no gravity to carry hot gas away.' },
  { id:'expl',  name:'Exploration 8.2 psi',o2:34,  p:56.5,g:0.0,   f:10, cap:'The proposed exploration atmosphere: lower pressure, much more oxygen. Few tests sit here.' },
  { id:'moon',  name:'Lunar habitat',      o2:34,  p:56.5,g:0.166, f:8,  cap:'Same air on the Moon. One-sixth g is a partial buoyancy regime almost no one has burned anything in.' },
  { id:'mars',  name:'Mars transit',       o2:26.5,p:70,  g:0.38,  f:12, cap:'Mars gravity with a compromise atmosphere. Parabolic flights reach it for seconds at a time.' },
  { id:'earth', name:'Earth lab',          o2:21,  p:101, g:1.0,   f:0,  cap:'Normal gravity: buoyancy stretches the flame into a teardrop and feeds it fresh air.' },
];
const S = { o2:21, p:101, g:0, f:10, mat:'fabric', act:'habitat', event:'nominal', node:null, preset:'iss' };

/* ============================================================
   RENDERER / SCENE
   ============================================================ */
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch (e) {
  const el = document.getElementById('err'); el.style.display='grid';
  el.textContent = 'WebGL is not available in this browser, so the 3D simulation cannot start.';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050b);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.16;

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 2000);
camera.position.set(9, 4.5, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 3; controls.maxDistance = 60;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const sun = new THREE.DirectionalLight(0xfff3e0, 1.6);
sun.position.set(-30, 25, 18); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-12, right:12, top:12, bottom:-12, near:1, far:120 });
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x6f8fd0, 0x0a0f1c, 0.35));

/* ---------- helpers ---------- */
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const smooth = (a,b,v)=>{ const t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(r){ return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2832*r()); }
function glowSprite(){
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.25,'rgba(255,255,255,.6)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const SPRITE = glowSprite();

/* ============================================================
   SPACE BACKDROP: stars, Earth, Moon
   ============================================================ */
{
  const n=6000, pos=new Float32Array(n*3), col=new Float32Array(n*3), r=rng(7);
  for(let i=0;i<n;i++){
    const u=r()*2-1, th=r()*6.2832, R=600+r()*400, s=Math.sqrt(1-u*u);
    pos.set([R*s*Math.cos(th), R*u, R*s*Math.sin(th)], i*3);
    const t=r(), c=new THREE.Color().setHSL(t<.2?0.08:t<.5?0.6:0.62, t<.2?0.6:0.3, 0.6+r()*0.4);
    col.set([c.r,c.g,c.b], i*3);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:2.2,map:SPRITE,vertexColors:true,transparent:true,depthWrite:false,sizeAttenuation:false,blending:THREE.AdditiveBlending})));
}
// Procedural Earth: noise continents + atmosphere rim shader
const earth = new THREE.Group(); earth.position.set(-150, -230, -520); scene.add(earth);
{
  const c=document.createElement('canvas'); c.width=1024; c.height=512; const x=c.getContext('2d');
  x.fillStyle='#0b2a5c'; x.fillRect(0,0,1024,512);
  const r=rng(42);
  x.filter='blur(5px)';
  for(let k=0;k<70;k++){ // blobby continents
    const cx=r()*1024, cy=80+r()*350, rad=20+r()*90;
    x.fillStyle=`hsl(${95+r()*40},${35+r()*20}%,${22+r()*14}%)`;
    x.beginPath(); for(let a=0;a<6.3;a+=0.3){ const rr=rad*(0.6+r()*0.6); x.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*0.7); } x.fill();
  }
  x.filter='blur(3px)';
  x.fillStyle='rgba(240,245,255,.9)'; x.fillRect(0,0,1024,26); x.fillRect(0,486,1024,26);
  x.filter='blur(6px)';
  for(let k=0;k<120;k++){ x.fillStyle=`rgba(255,255,255,${0.08+r()*0.2})`; x.beginPath(); x.ellipse(r()*1024,r()*512,10+r()*60,3+r()*10,r()*3,0,6.3); x.fill(); }
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const e=new THREE.Mesh(new THREE.SphereGeometry(60,96,64), new THREE.MeshStandardMaterial({map:tex,roughness:.85,metalness:0}));
  earth.add(e); earth.userData.globe=e;
  const atm=new THREE.Mesh(new THREE.SphereGeometry(63.5,64,48), new THREE.ShaderMaterial({
    transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false,
    vertexShader:`varying vec3 vN;varying vec3 vP;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vP=-mv.xyz;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vN;varying vec3 vP;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vP))),2.5);gl_FragColor=vec4(vec3(.3,.6,1.)*f*1.6,f);}`
  }));
  earth.add(atm);
}
const moon = new THREE.Mesh(new THREE.SphereGeometry(14,64,48), new THREE.MeshStandardMaterial({color:0x8a8a90,roughness:1}));
moon.position.set(260,60,-420); scene.add(moon);

/* ============================================================
   ACT 1: HABITAT MODULE + FLAME
   ============================================================ */
const HAB = new THREE.Group(); scene.add(HAB);

/* ---------- flame shader ---------- */
const NOISE = `
float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}`;
const NTH = 33; // angles sampled from downstream to upstream
function flameMaterial(base, tip, rimMix, power){
  const defs = { NTH };
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
    defines: defs,
    uniforms:{ uTime:{value:0}, uDir:{value:new THREE.Vector3(0,1,0)}, uR:{value:new Array(NTH).fill(0.3)}, uFlicker:{value:0}, uFreq:{value:0},
      uScale:{value:1}, uBase:{value:new THREE.Color(base)}, uTip:{value:new THREE.Color(tip)}, uAlpha:{value:1}, uRim:{value:rimMix}, uPow:{value:power}, uSeed:{value:Math.random()*10} },
    vertexShader:`${NOISE}
      uniform float uTime,uFlicker,uFreq,uScale,uSeed; uniform vec3 uDir; uniform float uR[NTH];
      varying vec3 vN; varying vec3 vV; varying float vT;
      // Radius along each direction comes from flame-model.js (iso-surface of the mixture fraction).
      // theta = 0 is downstream. Noise only adds buoyant flicker, scaled by the model's buoyant share.
      void main(){
        vec3 p=normalize(position); float t=clamp(dot(p,uDir),-1.,1.); float up=max(t,0.);
        float x=acos(t)/3.14159265*float(NTH-1); int i=int(floor(x)); int j=min(i+1,NTH-1);
        float r=mix(uR[i],uR[j],x-float(i));
        float n=noise(p*2.2+uDir*(-uTime*uFreq*.6)+uSeed)-.5;
        float n2=noise(p*5.+uDir*(-uTime*uFreq*1.2)+uSeed*2.)-.5;
        vec3 q=p*r*(1.+(n*.5+n2*.25)*uFlicker*up);
        vT=(t+1.)*.5;
        vec4 mv=modelViewMatrix*vec4(q*uScale,1.);
        vV=normalize(-mv.xyz); vN=normalize(normalMatrix*normal);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform vec3 uBase,uTip; uniform float uAlpha,uRim,uPow;
      varying vec3 vN; varying vec3 vV; varying float vT;
      void main(){
        float f=abs(dot(normalize(vN),normalize(vV)));
        float rim=pow(1.-f,uPow); float core=pow(f,2.);
        vec3 c=mix(uBase,uTip,smoothstep(.2,.95,vT));
        float a=uAlpha*mix(core,rim,uRim)*(1.-smoothstep(.85,1.,vT)*.6);
        gl_FragColor=vec4(c*a,a);
      }`
  });
}

    img.data[k]=lerp(120,40,cov)|0; img.data[k+1]=lerp(25,230,cov)|0; img.data[k+2]=lerp(60,200,cov)|0; img.data[k+3]=lerp(90,190,cov)|0;
  }
  ctx.putImageData(img,0,0); heatTex.needsUpdate=true;
}

// PYRA gap logic (port of pyra/gaps.py classify_axis + _numeric_axis essentials)
function classifyAxis(values,target,tol){
  values=values.filter(v=>v!=null);
  if(!values.length) return {cls:'NO_INDEXED_DATA',dist:null};
  const within=values.filter(v=>Math.abs(v-target)<=tol).length;
  if(within>=MIN_RUNS) return {cls:'DIRECTLY_TESTED',dist:0,within};
  if(within) return {cls:'INSUFFICIENT',dist:0,within};
  const dist=Math.min(...values.map(v=>Math.abs(v-target)))/tol;
  if(Math.min(...values)<target && target<Math.max(...values)) return {cls:'BOUNDED',dist};
  return {cls:'ONE_SIDED',dist};
}
const MATCLASS={fabric:'fabric',plastic:'plastic',paper:'paper',wire:'wire'};
function analyze(){
  const t={o2:S.o2,p:S.p,f:S.f,g:S.g};
  const ranges = RANGE_DEF.flatMap(d=>[d]);
  const out={};
  for(const ax of ['o2','p','f','g']){
    const values=[...RUNS.map(r=>r[ax]), ...ranges.flatMap(d=>d[ax]? [d[ax][0],d[ax][1]]:[])];
    const measured=[...RUNS.filter(r=>!(ax==='g'&&r.word)).map(r=>r[ax]), ...ranges.flatMap(d=>d[ax]?[d[ax][0],d[ax][1]]:[])];
    let res=classifyAxis(values,t[ax],TOL[ax]);
    if(res.cls==='DIRECTLY_TESTED'||res.cls==='INSUFFICIENT'){
      const m=classifyAxis(measured,t[ax],TOL[ax]);
      if(m.cls!=='DIRECTLY_TESTED'&&m.cls!=='INSUFFICIENT') res={cls:'NOT_COMPARABLE',dist:0}; else res=m;
    }
    out[ax]=res;
  }
  const matchN=RUNS.filter(r=>r.mat===S.mat).length+RANGE_DEF.filter(d=>d.mat===S.mat).length;
  out.mat={cls: matchN>=MIN_RUNS?'DIRECTLY_TESTED':matchN?'INSUFFICIENT':'NO_INDEXED_DATA', within:matchN};
  // combination: any single run within tolerance on every axis
  const fits=RUNS.filter(r=>!r.word && r.mat===S.mat && ['o2','p','g'].every(a=>Math.abs(r[a]-t[a])<=TOL[a]) && (r.f==null||Math.abs(r.f-t.f)<=TOL.f));
  out.combo=fits.length;
  const ranked=RUNS.map(r=>{ const gs=['o2','p','f','g'].filter(a=>r[a]!=null).map(a=>(r[a]-t[a])/TOL[a]); return {r,d:Math.sqrt(gs.reduce((s,x)=>s+x*x,0)/gs.length),n:gs.length}; })
    .sort((a,b)=>a.d-b.d||b.n-a.n).slice(0,3);
  out.nearest=ranked;
  return out;
}

/* ============================================================
   FLAME MODEL: physics in flame-model.js (window.PyraFlame); this only maps it to the scene
   ============================================================ */
const MAT = { fabric:{soot:1.0,ign:0}, plastic:{soot:1.4,ign:1.0}, paper:{soot:0.7,ign:-1.0}, wire:{soot:1.2,ign:2.0} };
const SCENE_PER_M = 100;      // 1 scene unit = 1 cm in the sample chamber
const R_MAX = 1.4;            // the chamber glass; larger flames are drawn clipped (sizes in the panel are not)
const TIME_SCALE = 0.05;      // tracer playback at 1/20 real time so the motion can be followed
// Shells are iso-surfaces of the computed mixture fraction at Z = k * Z_st (k < 1: hot products outside
// the sheet, k = 1: the flame sheet, k > 1: fuel-rich core where soot forms).
const SHELL_Z = { outer:0.75, blue:1.0, soot:1.4, hot:3.5 };
const FS = { power:0, target:0, flicker:0, dir:new THREE.Vector3(0,1,0), soot:0, limit:16, alive:true, shape:'',
  model:null, radii:{}, shown:{} };
for(const k of Object.keys(SHELL_Z)){ FS.radii[k]=new Float64Array(NTH).fill(0.3); FS.shown[k]=new Float64Array(NTH).fill(0.3); }
function flameModel(){
  const m=MAT[S.mat];
  const out=PyraFlame.solve({ gravity:S.g*PyraFlame.G0, flow:S.f/100, o2:S.o2, pressure:S.p, fuel:S.mat });
  FS.model=out;
  const R=out.results;
  for(const [k,z] of Object.entries(SHELL_Z)){
    const r=PyraFlame.surface(out.state, z, NTH);
    for(let i=0;i<NTH;i++) FS.radii[k][i]=Math.min(r[i]*SCENE_PER_M, R_MAX);
  }
  FS.dir.set(R.direction[0], R.direction[1], 0);
  const gG=R.gravityG, b=Math.sqrt(gG);
  // ILLUSTRATIVE oxygen limit, unchanged from the earlier demo (to be replaced by a stability model):
  // higher in quiescent microgravity, lower with gentle flow, higher at low pressure.
  const transport = clamp(b*1.4 + S.f/12, 0, 1.6);
  let limit = 15.5 + 4.5*Math.exp(-transport*2.2) + (101-S.p)/34 + m.ign;
  if(S.f>28) limit += (S.f-28)*0.25;
  FS.limit=limit;
  const margin=S.o2-limit;
  FS.alive = margin>0;
  FS.target = FS.alive ? clamp(0.25+margin/9,0.25,1.3) : 0;
  FS.flicker = clamp(R.buoyantShare,0,1);                 // buoyant flicker only where buoyancy drives the flow
  // ILLUSTRATIVE soot colour (visual only, not computed)
  FS.soot = clamp(b + S.f/40,0,1) * m.soot * (0.45+0.55*smooth(14,32,S.o2)) * clamp(S.p/101,0.5,1.2);
  FS.shape = !FS.alive?'extinguished': R.peclet<1?'near-spherical (diffusion-dominated)': R.buoyantShare>0.6?'buoyant plume':'stretched by flow';
}

function stepTelemetry(dt){
  TEL.t=Math.min(TEL.t+dt,25); const ev=EVENTS[S.event]; const n=()=>gauss(telRand);
  const base={o2:S.o2,p:S.p,smoke:0,co:1,temp:22,flow:S.f};
  const burn = FS.power;
  base.smoke += burn*FS.soot*0.05; base.co += burn*2; base.temp += burn*1.5;
  for(const k of Object.keys(base)){
    let v=base[k]+(ev.drift[k]||0)*TEL.t + n()*({o2:.08,p:.15,smoke:.003,co:.15,temp:.06,flow:.2}[k]);
    if(k==='smoke') v=clamp(v,0,1); else v=Math.max(0,v);
    if(ev.stuck===k){ if(stuckVal==null) stuckVal=v; v=stuckVal; }
    TEL[k]=lerp(TEL[k],v,0.25);
  }
}
function level(id,v){
  const L=LIMITS[id]; if(!L) return 'ok';
  if((L.max!=null&&v>L.max)||(L.min!=null&&v<L.min)) return 'alert';

  if((L.max!=null&&v>L.max-span)||(L.min!=null&&v<L.min+span)) return 'watch';
  return 'ok';
}

    const L=LIMITS[s.id]; const lim=L? (L.max!=null?`≤ ${L.max}`:'')+(L.min!=null?` ≥ ${L.min}`:''):'';
    return `<div class="tile ${l}"><span>${s.name}</span><b>${s.fmt(v)}</b> <small>${s.unit}</small><br><small>${lim}</small></div>`; }).join('');
  if(S.event==='stuck') worst = worst==='ok'?'watch':worst;
  const cs=$('cstate'); cs.className='state '+worst; cs.textContent= worst==='ok'?'ALL NOMINAL': worst==='watch'?(S.event==='stuck'?'WATCH · O₂ READING FROZEN':'WATCH · APPROACHING LIMIT'):'CONCERN · LIMIT EXCEEDED';
}
function selectNode(id){ S.node=id; if(S.act!=='pipeline') goAct('pipeline'); else { renderRight(); focusNode(id); } }
function focusNode(id){ const n=nodeById[id]; const wp=new THREE.Vector3(); n.obj.getWorldPosition(wp); flyTo(wp.clone().add(new THREE.Vector3(2,2.5,13)), wp, 1.4); }

/* ---------- left panel: presets + sliders ---------- */
const presetsEl=document.getElementById('presets');
presetsEl.innerHTML=PRESETS.map(p=>`<button class="chip" data-p="${p.id}">${p.name}</button>`).join('');
presetsEl.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>applyPreset(b.dataset.p,true));
const ctl={o2:document.getElementById('o2'),p:document.getElementById('p'),g:document.getElementById('g'),f:document.getElementById('f'),mat:document.getElementById('mat')};
function syncSliders(){
  for(const k of ['o2','p','g','f']){ const el=ctl[k]; el.value=S[k]; el.style.setProperty('--p',((S[k]-el.min)/(el.max-el.min)*100)+'%'); }
  ctl.mat.value=S.mat;
  document.getElementById('o2v').textContent=S.o2.toFixed(1)+' %';
  document.getElementById('pv').textContent=S.p.toFixed(0)+' kPa · '+(S.p/6.895).toFixed(1)+' psi';
  const gname=S.g<0.01?' µg':Math.abs(S.g-0.166)<0.02?' Moon':Math.abs(S.g-0.38)<0.02?' Mars':Math.abs(S.g-1)<0.02?' Earth':'';
  document.getElementById('gv').textContent=S.g.toFixed(3)+' g · '+(S.g*PyraFlame.G0).toFixed(2)+' m/s²'+gname;
  document.getElementById('fv').textContent=S.f.toFixed(1)+' cm/s';
  presetsEl.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===S.preset));
}
let heatDirty=true, scenVer=0, cacheA=null, cacheVer=-1;
function onScenario(){ scenVer++; flameModel(); syncSliders(); heatDirty=true; if(S.act==='atlas') renderRight(); else if(S.act==='habitat') updateHabitatPanel(); }
for(const k of ['o2','p','g','f']) ctl[k].addEventListener('input',()=>{ S[k]=parseFloat(ctl[k].value); S.preset=null; onScenario(); });
ctl.mat.addEventListener('change',()=>{ S.mat=ctl.mat.value; S.preset=null; onScenario(); });
// tween scenario values for presets
let scenTween=null;
function applyPreset(id,tween){
  const p=PRESETS.find(x=>x.id===id); S.preset=id;
  if(!tween){ Object.assign(S,{o2:p.o2,p:p.p,g:p.g,f:p.f}); onScenario(); return; }
  scenTween={from:{o2:S.o2,p:S.p,g:S.g,f:S.f},to:p,t:0};

}

/* ============================================================
   CAMERA / ACT TRANSITIONS
   ============================================================ */
const VIEWS={
  habitat:{pos:new THREE.Vector3(5.2,1.9,10.2), tgt:new THREE.Vector3(0,-0.3,-1.2)},
  atlas:  {pos:new THREE.Vector3(80+11,6.5,24), tgt:new THREE.Vector3(80,0.3,-0.5)},
  pipeline:{pos:new THREE.Vector3(-80+3,6,47), tgt:new THREE.Vector3(-80+3,0.5,0)},
};
let fly=null, transitioning=false;
function flyTo(pos,tgt,dur=2.2){ fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos.clone(),t1:tgt.clone(),t:0,dur}; transitioning=true; }
const CAPS={
  habitat:['Act 01 · Habitat','A cutaway habitat module. Drag the sliders: the flame, airflow and simulated cabin sensors all respond to the same scenario.'],
  atlas:['Act 02 · Evidence Atlas','Every dot is a test run in oxygen, pressure and gravity. The orange box is "close enough" to your scenario. Empty space is where the evidence stops.'],
  pipeline:['Act 03 · Data Pipeline','From NASA papers to the app. Every number is extracted, adversarially checked, validated, and only then built into the database.'],
};
function goAct(a){

  const v=VIEWS[a]; flyTo(v.pos,v.tgt); renderRight(); caption(...CAPS[a]);

}
document.querySelectorAll('#acts button').forEach(b=>b.onclick=()=>{ stopTour(); goAct(b.dataset.act); });
document.getElementById('swap').onclick=()=>document.body.classList.toggle('showright');

/* ---------- captions ---------- */
let capTimer=null;
function caption(t,s,hold=9000){
  const T=document.getElementById('capT'), Sx=document.getElementById('capS');
  Sx.style.opacity=0; setTimeout(()=>{ T.textContent=t; Sx.innerHTML=s; Sx.style.opacity=1; },250);
  clearTimeout(capTimer); if(!touring) capTimer=setTimeout(()=>{ Sx.style.opacity=0; T.textContent=''; },hold);
}

/* ---------- guided tour ---------- */
const TOUR=[
  {act:'habitat',preset:'earth',dur:7,t:'On Earth',s:'Buoyancy pulls hot gas upward. The flame is a bright, sooty, flickering teardrop.'},
  {act:'habitat',preset:'iss',dur:8,t:'In orbit',s:'Take gravity away and the same fuel burns as a <b>dim blue ball</b>, steady and almost invisible, fed only by diffusion and a gentle push from the ventilation fan.'},
  {act:'habitat',preset:'expl',dur:8,t:'Exploration atmosphere',s:'Drop pressure to 8.2 psi and raise oxygen to 34%. The flame grows and the O₂ sensor is now near its PLACEHOLDER limit.'},
  {act:'habitat',preset:'expl',event:'wire',dur:8,t:'Concern engine',s:'An overheating wire: smoke, CO and temperature drift up. The concern engine flags it against the limits, using SIMULATED telemetry.'},
  {act:'atlas',preset:'iss',dur:8,t:'Is there evidence?',s:'ISS air sits inside a dense cluster of test runs, and many of them match on every axis at once.'},
  {act:'atlas',preset:'moon',dur:9,t:'Lunar habitat',s:'Move the scenario to the Moon. Oxygen and pressure each look covered, but <b>no single run</b> matched all axes. That empty space is the finding.'},
  {act:'atlas',preset:'mars',dur:7,t:'Mars gravity',s:'A thin band of parabolic-flight runs reaches 0.38 g, only at Earth pressure. The gap engine reports what is bounded and what is one-sided.'},
  {act:'pipeline',node:'val',dur:8,t:'Trust the input',s:'Every factsheet is checked by a second person. Validation rejects anything without a source. Red packets fall out.'},
  {act:'pipeline',node:'gaps',dur:8,t:'One corpus, many engines',s:'Ranking, gaps, retrieval and the concern engine all read the same verified corpus and feed the six views of the app.'},
];
let touring=false, tourIdx=0, tourT=0;
const tourBtn=document.getElementById('tour'), prog=document.getElementById('progress');
function startTour(){ touring=true; tourIdx=-1; tourBtn.classList.add('on'); tourBtn.textContent='■ Stop'; prog.style.opacity=1; nextTour(); }
function stopTour(){ if(!touring) return; touring=false; tourBtn.classList.remove('on'); tourBtn.textContent='▶ Tour'; prog.style.opacity=0; }
function nextTour(){
  tourIdx=(tourIdx+1)%TOUR.length; tourT=0; const st=TOUR[tourIdx];
  if(st.node) S.node=st.node;
  if(S.act!==st.act) goAct(st.act); else if(st.node) { renderRight(); focusNode(st.node); }
  if(st.preset && st.preset!==S.preset) applyPreset(st.preset,true);
  const ev=st.event||'nominal'; if(ev!==S.event){ S.event=ev; resetTelemetry(); if(S.act==='habitat') renderRight(); }
  setTimeout(()=>caption(st.t,st.s),60);
}
tourBtn.onclick=()=>touring?stopTour():startTour();
renderer.domElement.addEventListener('pointerdown',()=>{ if(touring) stopTour(); });

/* ---------- picking pipeline nodes ---------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5||S.act!=='pipeline') return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(PIPE.children,true).find(h=>h.object.userData.node);
  if(hit) selectNode(hit.object.userData.node);
});

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock=new THREE.Clock(); let elapsed=0, panelT=0; const _fw=new THREE.Vector3();
const TIP_BLUE=new THREE.Color(0xb0e0ff), TIP_SOOT=new THREE.Color(0xff9a3c);
const tmpC=new THREE.Color(), cool=new THREE.Color(0x6fb6ff), hot=new THREE.Color(0xff8a3a);
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05); elapsed+=dt;

  // scenario tween
  if(scenTween){ scenTween.t=Math.min(1,scenTween.t+dt/1.6); const e=1-Math.pow(1-scenTween.t,3);
    for(const k of ['o2','p','g','f']) S[k]=lerp(scenTween.from[k],scenTween.to[k],e);
    if(scenTween.t>=1){ for(const k of ['o2','p','g','f']) S[k]=scenTween.to[k]; scenTween=null; }
    onScenario(); }

  // camera fly
  if(fly){ fly.t=Math.min(1,fly.t+dt/fly.dur); const e=fly.t<.5?4*fly.t**3:1-Math.pow(-2*fly.t+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e);
    // arc upward mid-flight for a cinematic swoop
    camera.position.y += Math.sin(e*Math.PI)*(fly.p0.distanceTo(fly.p1)>30?14:0);
    if(fly.t>=1){ fly=null; transitioning=false; } }
  controls.update();

  // tour
  if(touring){ tourT+=dt; const st=TOUR[tourIdx]; prog.firstChild.style.width=(tourT/st.dur*100)+'%'; if(tourT>=st.dur) nextTour(); }

  earth.userData.globe.rotation.y+=dt*0.01; earth.visible = moon.visible = S.act==='habitat' || (transitioning && fly && fly.t<0.5); moon.rotation.y+=dt*0.005;
  HAB.rotation.y = 0;

  // ---- flame ----
  FS.power = lerp(FS.power, FS.target, 1-Math.exp(-dt*(FS.target>FS.power?2.5:1.6)));
  const pw=FS.power, flick=1+(Math.sin(elapsed*23)*0.5+Math.sin(elapsed*37.3)*0.3)*FS.flicker*0.08;
  const MR=FS.model?FS.model.results:null;
  const shells=[[shellOuter,'outer'],[shellBlue,'blue'],[coreSoot,'soot'],[coreHot,'hot']];
  const ease=1-Math.exp(-dt*4), grow=0.6+0.4*clamp(pw,0,1), fz=MR?MR.flickerHz:0;
  for(const [m,k] of shells){ const u=m.material.uniforms, tgt=FS.radii[k], cur=FS.shown[k];
    for(let i=0;i<NTH;i++){ cur[i]+=(tgt[i]-cur[i])*ease; u.uR.value[i]=cur[i]*grow; }
    u.uTime.value=elapsed; u.uDir.value.copy(FS.dir); u.uFlicker.value=FS.flicker*0.35; u.uFreq.value=fz*TIME_SCALE*6.283;
    u.uScale.value=1; }
  const bluePart=1-clamp(FS.soot,0,1);
  shellOuter.material.uniforms.uAlpha.value=pw*0.6*(0.5+bluePart*0.8);
  shellBlue.material.uniforms.uAlpha.value=pw*(0.35+bluePart*1.5);
  shellBlue.material.uniforms.uTip.value.copy(TIP_BLUE).lerp(TIP_SOOT,clamp(FS.soot*1.3,0,1));
  coreSoot.material.uniforms.uAlpha.value=pw*FS.soot*2.2;
  coreHot.material.uniforms.uAlpha.value=pw*(0.08+FS.soot*0.9);
  FL.visible = pw>0.005;
  tmpC.copy(cool).lerp(hot,clamp(FS.soot,0,1));
  flameLight.color.copy(tmpC); flameLight.intensity=pw*(14+FS.soot*45)*flick;
  fuel.material.emissiveIntensity=pw*(0.15+FS.soot*0.8);

  // embers / soot
  EMB.acc += dt*pw*(40+FS.soot*220);
  while(EMB.acc>1){ EMB.acc-=1; const i=EMB.next; EMB.next=(EMB.next+1)%EMB.n;
    // released on the flame sheet, in a random direction
    const a=Math.random()*6.28, u=Math.random()*2-1, s=Math.sqrt(1-u*u), dx=Math.cos(a)*s, dz=Math.sin(a)*s;
    const ct=clamp(dx*FS.dir.x+u*FS.dir.y,-1,1), x=Math.acos(ct)/Math.PI*(NTH-1), i0=Math.floor(x), i1=Math.min(i0+1,NTH-1);
    const rr=lerp(FS.shown.blue[i0],FS.shown.blue[i1],x-i0);
    EMB.pos.set([dx*rr, u*rr, dz*rr],i*3);
    EMB.life[i]=1; }
  // tracers: advected by the model's convective velocity, plus a random walk with the film diffusivity
  const dtp=dt*TIME_SCALE, Uv=MR?MR.convectiveVelocity*SCENE_PER_M*dtp:0;
  const walk=MR?Math.sqrt(2*FS.model.properties.film.D*dtp)*SCENE_PER_M:0;
  for(let i=0;i<EMB.n;i++){
    if(EMB.life[i]<=0){ EMB.col[i*3]=EMB.col[i*3+1]=EMB.col[i*3+2]=0; continue; }
    EMB.life[i]-=dt*(0.45+Math.random()*0.2);
    EMB.pos[i*3]+=FS.dir.x*Uv+gauss(Math.random)*walk;
    EMB.pos[i*3+1]+=FS.dir.y*Uv+gauss(Math.random)*walk;
    EMB.pos[i*3+2]+=gauss(Math.random)*walk;
    const L=Math.max(EMB.life[i],0), hotness=L*L;
    EMB.col[i*3]=hotness*1.0+0.05*L; EMB.col[i*3+1]=hotness*0.45; EMB.col[i*3+2]=hotness*0.12*(1-FS.soot)+0.02*L;
  }
  EMB.g.attributes.position.needsUpdate=EMB.g.attributes.color.needsUpdate=true;

  // ventilation particles
  if(S.act==='habitat'||transitioning){
    const flowV=TEL.flow*0.05+0.02, fw=_fw; FL.getWorldPosition(fw); const lift=MR?MR.buoyantShare*Math.sqrt(MR.gravityG):0;
    for(let i=0;i<AIR.n;i++){ const j=i*3;
      AIR.pos[j]+=dt*flowV*(0.8+0.4*Math.sin(AIR.ph[i]));
      AIR.pos[j+1]+=Math.sin(elapsed*0.7+AIR.ph[i])*dt*0.03 + lift*dt*0.02*pw*Math.max(0,1-Math.hypot(AIR.pos[j]-fw.x,AIR.pos[j+2]-fw.z)/2);
      if(AIR.pos[j]>LEN/2-0.2){ AIR.pos[j]=-LEN/2+0.2; }
      const dy=AIR.pos[j+1]-fw.y; if(Math.abs(AIR.pos[j+1])>RAD-0.3) AIR.pos[j+1]*=0.98;
      const d=Math.hypot(AIR.pos[j]-fw.x, dy, AIR.pos[j+2]-fw.z);
      const near=Math.exp(-d*d/1.6)*pw, smoke=clamp(TEL.smoke*3,0,1);
      AIR.col[j]=0.12+near*0.9+smoke*0.2; AIR.col[j+1]=0.32+near*0.3-smoke*0.1; AIR.col[j+2]=0.42-near*0.3-smoke*0.2;
      const a=(0.35+0.65*Math.min(1,TEL.flow/10))*0.55; AIR.col[j]*=a; AIR.col[j+1]*=a; AIR.col[j+2]*=a;
    }
    AIR.g.attributes.position.needsUpdate=AIR.g.attributes.color.needsUpdate=true;
  }

  // telemetry + sensor LEDs + pins
  stepTelemetry(dt);
  for(const s of SENSORS){ const l=level(s.id,TEL[s.id]); s.led.material.color.set(l==='alert'?0xff4d5e:l==='watch'?0xffb347:0x3ee08f);
    s.led.scale.setScalar(l==='alert'?1.4+Math.sin(elapsed*10)*0.4:1);
    s.pin.el.className='pin '+(l==='ok'?'':l)+(s.pin.el.classList.contains('hidden')?' hidden':'');
    s.pin.el.querySelector('.v').textContent=s.fmt(TEL[s.id])+(s.unit?' '+s.unit:''); }
  flamePin.el.querySelector('.v').textContent=FS.alive?FS.shape.split(' (')[0]:'out';
  panelT+=dt; if(panelT>0.25 && S.act==='habitat'){ panelT=0; updateHabitatPanel(); }

  // ---- atlas ----
  if(S.act==='atlas'||transitioning){
    const sp=toAtlas(S.o2,S.p,S.g); scenMark.position.copy(sp);
    const lo=toAtlas(S.o2-TOL.o2,S.p-TOL.p,Math.max(0,S.g-TOL.g)), hi=toAtlas(S.o2+TOL.o2,S.p+TOL.p,Math.min(1,S.g+TOL.g));
    const sz=hi.clone().sub(lo); tolBox.scale.copy(sz); tolEdge.scale.copy(sz); tolBox.position.copy(lo.clone().add(hi).multiplyScalar(.5)); tolEdge.position.copy(tolBox.position);
    scenGlow.scale.setScalar(2+Math.sin(elapsed*3)*0.3);
    const h=BOX/2, dp=dropGeo.attributes.position;
    dp.setXYZ(0,sp.x,sp.y,sp.z); dp.setXYZ(1,sp.x,-h,sp.z); dp.setXYZ(2,sp.x,sp.y,sp.z); dp.setXYZ(3,-h,sp.y,sp.z); dp.setXYZ(4,sp.x,sp.y,sp.z); dp.setXYZ(5,sp.x,sp.y,-h);
    dp.needsUpdate=true; drops.computeLineDistances();
    heat.position.set(0,0,sp.z);
    if(heatDirty){ heatDirty=false; drawHeat(); }
    if(cacheVer!==scenVer){ cacheA=analyze(); cacheVer=scenVer; } const A=cacheA;
    const bp=beamGeo.attributes.position;
    A.nearest.forEach((n,i)=>{ bp.setXYZ(i*2,sp.x,sp.y,sp.z); bp.setXYZ(i*2+1,n.r.mesh.position.x,n.r.mesh.position.y,n.r.mesh.position.z); }); bp.needsUpdate=true;
    beamMat.uniforms.uTime.value=elapsed;
    const nearSet=new Set(A.nearest.map(n=>n.r));
    for(const r of RUNS){
      const inside=Math.abs(r.o2-S.o2)<=TOL.o2&&Math.abs(r.p-S.p)<=TOL.p&&Math.abs(r.g-S.g)<=TOL.g;
      const tgt=inside?1.9:nearSet.has(r)?1.5:1; r.mesh.scale.setScalar(lerp(r.mesh.scale.x,tgt,0.15));
      if(r.mesh.material.emissiveIntensity!=null) r.mesh.material.emissiveIntensity=inside?2.2:nearSet.has(r)?1.2:0.35;
      r.mesh.position.y = r.home.y + Math.sin(elapsed*0.8+r.home.x)*0.03;
      if(r.word) r.mesh.lookAt(camera.position);
    }
  }

  // ---- pipeline ----
  if(S.act==='pipeline'||transitioning){
    pkTimer+=dt; if(pkTimer>0.35){ pkTimer=0; spawnPacket(0, 0x9fd2ff, Math.random()<0.22); }
    for(const n of NODES){ n.mesh.rotation.y+=dt*0.4; n.mesh.rotation.x=Math.sin(elapsed*0.5+n.pos[0])*0.2; n.wire.rotation.y-=dt*0.15;
      const sel=n.id===S.node; n.mat.emissiveIntensity=lerp(n.mat.emissiveIntensity, sel?1.6:0.35+(n.flash||0), 0.1); n.flash=(n.flash||0)*0.92;
      n.wire.material.opacity=sel?0.35:0.08; }
    for(const p of PK){
      if(p.dead) continue;
      const E=CURVES[p.e];
      if(p.falling){ p.vy-=dt*4; p.m.position.y+=p.vy*dt; p.m.position.z+=dt*1.5; p.life-=dt; p.m.scale.setScalar(Math.max(p.life,0.01));
        if(p.life<=0){ p.dead=true; PIPE.remove(p.m); } continue; }
      p.t+=dt*p.speed; if(p.t<1){ p.m.position.copy(E.c.getPointAt(p.t)); continue; }
      const nodeId=E.b; nodeById[nodeId].flash=0.8;
      if(nodeId==='p12' && p.reject){ p.m.material.color.set(0xff4d5e); p.m.children[0].material.color.set(0xff4d5e); }
      if(nodeId==='val' && p.reject){ p.falling=true; p.vy=1.2; p.life=1.4; continue; }
      if(nodeId==='p12') { p.m.material.color.set(p.reject?0xff4d5e:0xffd27a); p.m.children[0].material.color.set(p.reject?0xff4d5e:0xffd27a); }
      if(nodeId==='db') { p.m.material.color.set(0x46f0e0); p.m.children[0].material.color.set(0x46f0e0); }
      const outs=CURVES.map((c,i)=>[c,i]).filter(([c])=>c.a===nodeId);
      if(!outs.length){ p.dead=true; PIPE.remove(p.m); continue; }
      if(nodeId==='ev'){ // fan out to every engine
        for(let k=1;k<outs.length;k++){ spawnPacket(outs[k][1], engineColor(outs[k][0].b)); PK[PK.length-1].t=0; }
        p.m.material.color.set(engineColor(outs[0][0].b)); p.m.children[0].material.color.set(engineColor(outs[0][0].b));
      }
      p.e=outs[0][1]; p.t=0;
    }
    for(let i=PK.length-1;i>=0;i--) if(PK[i].dead) PK.splice(i,1);
  }

  updatePins();
  composer.render();
}
function engineColor(id){ return nodeById[id].color; }

/* ============================================================
   BOOT
   ============================================================ */
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); bloom.resolution.set(innerWidth,innerHeight); });
renderer.domElement.addEventListener('webglcontextlost',e=>{ e.preventDefault(); const el=document.getElementById('err'); el.style.display='grid'; el.textContent='The graphics context was lost. Reload the page to restart the simulation.'; });
window.__pyra={S,camera,FS,get transitioning(){return transitioning},get fly(){return fly},get t(){return elapsed}, skip(){ if(fly) fly.dur=0.001; }, goAct, applyPreset, selectNode};
applyPreset('iss',false);
camera.position.copy(VIEWS.habitat.pos).add(new THREE.Vector3(10,8,18)); controls.target.copy(VIEWS.habitat.tgt);
flyTo(VIEWS.habitat.pos,VIEWS.habitat.tgt,3);
renderRight(); syncSliders();
animate();
setTimeout(()=>{ const l=document.getElementById('loading'); l.style.opacity=0; setTimeout(()=>l.remove(),1000); caption(...CAPS.habitat); },400);
</script>
